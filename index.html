<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTR Traffic Simulator & Analytics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="sidebar">
        <h1>🚇 MTR Network Simulator</h1>
        
        <div class="control-group">
            <label for="start">Origin Station</label>
            <select id="start"></select>
        </div>

        <div class="control-group">
            <label for="end">Destination Station</label>
            <select id="end"></select>
        </div>

        <div class="control-group">
            <label for="pax">Passenger Batch</label>
            <input type="number" id="pax" value="500" min="50" max="3000" step="50">
        </div>

        <button id="btn-go" class="btn-primary">Inject Passengers</button>

        <hr>

        <div class="control-group">
            <label>Simulation Clock (<span id="clock-display">08:30 AM</span>)</label>
            <input type="range" id="time-slider" min="360" max="1380" value="510" step="15">
        </div>

        <div class="control-group">
            <label>Traffic Presets</label>
            <button id="btn-rush" class="btn-primary">Morning Peak Commute</button>
            <button id="btn-cross" class="btn-green">Cross-Harbour Bottleneck</button>
            <button id="btn-clear" class="btn-red">Reset Network</button>
        </div>

        <div class="analytics-card">
            <h3>📊 Line Utilization</h3>
            <div id="utilization-bars"></div>
        </div>

        <div id="log"></div>
    </div>

    <div id="viewport">
        <canvas id="cvs"></canvas>
        <div id="tooltip"></div>
        <div id="view-controls">
            <button id="btn-zoom-in">+</button>
            <button id="btn-zoom-out">−</button>
            <button id="btn-zoom-reset">Reset View</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
